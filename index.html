<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SKY ACE Online 1v1</title><style>body{margin:0;background:#10283f;color:white;font:16px system-ui;overflow:hidden}canvas{display:block}#menu{position:fixed;inset:0;background:#10283fe9;display:grid;place-items:center;z-index:3}#panel{max-width:340px;text-align:center;padding:25px;background:#183954;border:1px solid #8bd5f0;border-radius:16px}button,input{font:inherit;padding:13px;border-radius:9px;border:0;margin:5px}button{background:#f4ba42;color:#182638;font-weight:800}input{width:130px;text-align:center;text-transform:uppercase}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 3px #000}#controls{position:fixed;bottom:16px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}#stick{width:115px;height:115px;border-radius:50%;background:#ffffff35;touch-action:none;position:relative;border:2px solid #fff8}#nub{width:45px;height:45px;border-radius:50%;background:#fff9;position:absolute;left:35px;top:35px}#fire{width:85px;height:85px;border-radius:50%;background:#ef6946;color:white;touch-action:none}#aim{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;pointer-events:none}#msg{position:fixed;top:22%;width:100%;text-align:center;font-weight:800;font-size:22px;pointer-events:none}</style></head><body><div id="menu"><div id="panel"><h1>✈ SKY ACE</h1><h3>ONLINE 1 vs 1</h3><p>Both players open this website and enter the same room code.</p><input id="room" maxlength="8" value="ACE123"><button id="join">JOIN ROOM</button><p id="status">Waiting to connect</p><p><a href="/classic" style="color:#9de6ff">Play classic single-player</a></p></div></div><div id="hud"><span id="you">YOU ♥♥♥ 100 HP</span><span id="them">RIVAL ♥♥♥ 100 HP</span></div><div id="aim">⊕</div><div id="msg"></div><div id="controls"><div id="stick"><div id="nub"></div></div><button id="fire">FIRE</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script><script>
let ws,slot=-1,active=false,enemy,plane,scene,camera,renderer,heading=0,pitch=0,steer=[0,0],firing=false,bullets=[],lastShot=0,hitLock=0,lastSend=0,enemyState=[0,35,-140,0,0],ownHp=100,ownLives=3,enemyHp=100,enemyLives=3;const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function message(s){$('msg').textContent=s;setTimeout(()=>{if($('msg').textContent===s)$('msg').textContent=''},2300)}
function makeJet(color){let g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.45});function part(w,h,d,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);g.add(m)}part(3,1.5,11,0,0,0);part(15,.35,2.5,0,-.2,1);part(5,.3,2.8,0,.6,4);part(.4,3,2,0,1.4,4);return g}
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8cc8ec);scene.fog=new THREE.Fog(0x8cc8ec,250,1300);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1600);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x355d7c,2));let sun=new THREE.DirectionalLight(0xffe7b5,2);sun.position.set(100,150,80);scene.add(sun);let sea=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshStandardMaterial({color:0x207da0}));sea.rotation.x=-Math.PI/2;sea.position.y=-5;scene.add(sea);for(let i=0;i<8;i++){let land=new THREE.Mesh(new THREE.CylinderGeometry(80+Math.random()*60,110,8,9),new THREE.MeshStandardMaterial({color:0x5a925a}));land.position.set((i%4-1.5)*320,-2,(Math.floor(i/4)-.5)*430);scene.add(land);for(let j=0;j<22;j++){let b=new THREE.Mesh(new THREE.BoxGeometry(10,12+Math.random()*60,10),new THREE.MeshStandardMaterial({color:0x8b9fae}));b.position.set(land.position.x+(Math.random()-.5)*110,8,land.position.z+(Math.random()-.5)*110);scene.add(b)}}plane=makeJet(0x56d8ff);enemy=makeJet(0xff7050);scene.add(plane,enemy);requestAnimationFrame(loop)}
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}function refresh(){ $('you').textContent=`YOU ${'♥'.repeat(ownLives)} ${ownHp} HP`;$('them').textContent=`RIVAL ${'♥'.repeat(enemyLives)} ${enemyHp} HP`}
$('join').onclick=()=>{if(ws)ws.close();$('status').textContent='Connecting...';ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>send({type:'join',room:$('room').value});ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){$('status').textContent='Room '+m.room+' — waiting for second player';slot=m.slot}if(m.type==='start'){slot=m.slot;active=true;ownHp=enemyHp=100;ownLives=enemyLives=3;plane.position.set(slot===0?0:0,35,slot===0?100:-100);heading=slot===0?0:Math.PI;enemy.position.set(0,35,slot===0?-100:100);$('menu').style.display='none';refresh();message('DOGFIGHT START!')}if(m.type==='state'){enemyState=m.p;enemy.position.set(m.p[0],m.p[1],m.p[2]);enemy.rotation.y=m.p[3];enemy.rotation.x=m.p[4]}if(m.type==='health'){ownHp=m.hp[slot];enemyHp=m.hp[1-slot];ownLives=m.lives[slot];enemyLives=m.lives[1-slot];refresh();if(ownHp===100&&ownLives>0&&ownLives<3){plane.position.set(0,35,slot===0?100:-100)}}if(m.type==='end'){active=false;$('menu').style.display='grid';$('status').textContent=m.winner===slot?'YOU WIN!':'YOU LOSE!'}if(m.type==='left'){active=false;$('menu').style.display='grid';$('status').textContent='Opponent disconnected'}if(m.type==='error')$('status').textContent=m.message};ws.onclose=()=>{active=false;$('status').textContent='Disconnected';$('menu').style.display='grid'}};
const stick=$('stick');function move(e){let r=stick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);steer=[clamp(x,-1,1),clamp(y,-1,1)];$('nub').style.left=(35+steer[0]*32)+'px';$('nub').style.top=(35+steer[1]*32)+'px'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);move(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))move(e)};stick.onpointerup=()=>{steer=[0,0];$('nub').style.left='35px';$('nub').style.top='35px'};$('fire').onpointerdown=e=>{e.preventDefault();firing=true};$('fire').onpointerup=()=>firing=false;$('fire').onpointercancel=()=>firing=false;const keys={};onkeydown=e=>{keys[e.key]=true};onkeyup=e=>{keys[e.key]=false};onresize=()=>{if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
let previous=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-previous)/1000);previous=now;if(active){heading+=(steer[0]+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*dt*1.15;pitch=clamp(pitch+(steer[1]+(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0))*dt*.7,-.7,.7);let dir=new THREE.Vector3(-Math.sin(heading)*Math.cos(pitch),Math.sin(pitch),-Math.cos(heading)*Math.cos(pitch));plane.position.addScaledVector(dir,dt*72);plane.position.y=clamp(plane.position.y,10,200);plane.rotation.y=heading;plane.rotation.x=pitch;camera.position.lerp(plane.position.clone().addScaledVector(dir,-30).add(new THREE.Vector3(0,9,0)),Math.min(1,dt*5));camera.lookAt(plane.position.clone().addScaledVector(dir,70));if(now-lastSend>65){send({type:'state',p:[plane.position.x,plane.position.y,plane.position.z,heading,pitch]});lastSend=now}if((firing||keys[' '])&&now-lastShot>200){lastShot=now;let g=new THREE.Mesh(new THREE.SphereGeometry(.75,6,6),new THREE.MeshBasicMaterial({color:0xffe769}));g.position.copy(plane.position).addScaledVector(dir,6);scene.add(g);bullets.push({g,dir,life:2});}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];let old=b.g.position.clone();b.g.position.addScaledVector(b.dir,dt*220);b.life-=dt;let segment=b.g.position.clone().sub(old),length=segment.lengthSq(),t=length?clamp(enemy.position.clone().sub(old).dot(segment)/length,0,1):0;if(old.addScaledVector(segment,t).distanceTo(enemy.position)<7&&now-hitLock>180){send({type:'hit'});hitLock=now;b.life=0;message('RIVAL HIT!')}if(b.life<=0){scene.remove(b.g);bullets.splice(i,1)}}}renderer.render(scene,camera)}setup();
</script></body></html>
